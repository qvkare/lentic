# Local stack in containers: anvil → contract deployment → policy signer (dev attestor).
#   docker compose -f deploy/docker-compose.yml up --build
# The host workflow (pnpm local:chain / local:deploy / policy) is equivalent and faster to iterate.
name: lentic

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8546", "--chain-id", "31337", "--block-time", "1"]
    ports: ["8546:8546"]
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8546"]
      interval: 2s
      retries: 30

  deploy:
    image: ghcr.io/foundry-rs/foundry:stable
    depends_on:
      anvil:
        condition: service_healthy
    working_dir: /contracts
    volumes:
      - ../contracts:/contracts
    entrypoint: ["forge", "script", "script/DeployLocal.s.sol:DeployLocal", "--rpc-url", "http://anvil:8546", "--broadcast", "--slow"]

  policy:
    build:
      context: ..
      dockerfile: deploy/policy.Dockerfile
    depends_on:
      deploy:
        condition: service_completed_successfully
    volumes:
      - ../contracts/deployments:/app/deployments:ro
    environment:
      BASE_RPC_URL: http://anvil:8546
      LENTIC_DEPLOYMENT: /app/deployments/31337.json
      LENTIC_ATTESTOR: dev
      LENTIC_DEV_ROUTES: "true"
      ZCASH_NETWORK: testnet
      LIGHTWALLETD: https://testnet.zec.rocks:443
    ports: ["8787:8787"]
