# dstack-simulator config for scripts/dstack-sim.sh: upstream sdk/simulator/dstack.toml (v0.6.0,
# Apache-2.0) with the internal API on TCP :8090 instead of the unix socket a CVM mounts.
[default]
workers = 8
max_blocking = 64
ident = "dstack Simulator"
temp_dir = "/tmp"
keep_alive = 10
log_level = "info"

[default.core]
keys_file = "appkeys.json"
compose_file = "app-compose.json"
sys_config_file = "sys-config.json"
data_disks = ["/"]

[default.core.simulator]
attestation_file = "attestation.bin"
patch_report_data = true

[internal-v0]
address = "unix:./tappd.sock"
reuse = true

[internal]
address = "0.0.0.0"
port = 8090

[external]
address = "unix:./external.sock"
reuse = true

[guest-api]
address = "unix:./guest.sock"
reuse = true
