[package]
name = "lentic-zcash"
description = "Lentic Zcash side: escrow keys/addresses, Ironwood PCZT pipeline, lightwalletd client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Offline helpers that fabricate an Ironwood deposit into an escrow (tests, local demo).
sim = []

[dependencies]
lentic-core = { workspace = true }
lentic-frost = { workspace = true }
rand_core_06 = { workspace = true }
pczt = { workspace = true, features = ["std", "orchard", "signer", "prover", "tx-extractor", "io-finalizer", "zcp-builder"] }
orchard = { workspace = true, features = ["circuit", "multicore", "std", "zeroize"] }
zcash_primitives = { workspace = true, features = ["std", "circuits", "multicore"] }
zcash_protocol = { workspace = true, features = ["std", "local-consensus"] }
zcash_keys = { workspace = true, features = ["std", "orchard", "sapling", "unstable-frost"] }
zcash_address = { workspace = true }
zcash_client_backend = { workspace = true, features = ["orchard", "lightwalletd-tonic-tls-webpki-roots", "lightwalletd-tonic-transport"] }
zcash_note_encryption = { workspace = true }
incrementalmerkletree = { workspace = true }
shardtree = { workspace = true }
pasta_curves = { workspace = true }
ff = { workspace = true }
rand = { workspace = true }
tonic = { version = "0.14", features = ["transport", "tls-ring", "tls-webpki-roots"] }
hex = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[[test]]
name = "escrow_e2e"
required-features = ["sim"]

[[test]]
name = "scan_e2e"
required-features = ["sim"]
